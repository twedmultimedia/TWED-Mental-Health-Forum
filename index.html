<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Registration</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1c2030;--muted:#6a7085;--line:#dde0ea;--accent:#4f46e5;--accent-t:#fff;--ok:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e2a;--text:#eceef6;--muted:#9aa0b5;--line:#2c3042;--accent:#8b85ff;--accent-t:#12141c;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e2a;--text:#eceef6;--muted:#9aa0b5;--line:#2c3042;--accent:#8b85ff;--accent-t:#12141c;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:1rem;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pay{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--text);font-size:1rem;margin:0}
.opt input{width:auto;margin:0}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.payqr{width:100%;max-width:300px;border-radius:12px;margin-top:12px;background:#fff}
.instr{margin-top:12px;font-size:.92rem;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin-top:6px}
.line{display:flex;justify-content:space-between;color:var(--muted);font-size:.92rem}
button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-t);font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:10px}
.err{color:#dc2626;font-size:.85rem;margin-top:10px;min-height:1em}
.hide{display:none}
.ticket{text-align:center}
.qr{background:#fff;display:inline-block;padding:12px;border-radius:12px;margin:10px 0}
.qr svg{width:220px;height:220px;display:block}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--ok);color:var(--ok);font-size:.8rem;font-weight:600}
.kv{text-align:left;margin-top:12px}
@media print{.noprint{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
<h1>Event Registration</h1>
<p class="sub noprint">Fill in your details, pay Php 350 by QR, and get your QR ticket.</p>

<form id="f" class="noprint" novalidate>
  <div class="card">
    <h2>1. Your details</h2>
    <label for="name" id="nlabel">Full name</label>
    <input id="name" autocomplete="name" required>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="phone">Phone</label>
    <input id="phone" type="tel" autocomplete="tel" required>
  </div>

  <div class="card">
    <h2>2. Registration type</h2>
    <div class="pay">
      <label class="opt"><input type="radio" name="rt" value="Individual" checked> Individual</label>
      <label class="opt"><input type="radio" name="rt" value="Group"> Group (one contact person registers everyone)</label>
    </div>
    <div id="gbox" class="hide">
      <label for="gsize">How many people are in the group?</label>
      <input id="gsize" type="number" min="2" max="100" value="2" inputmode="numeric">
    </div>
    <div class="line" style="margin-top:12px"><span>Fee per person</span><span id="fee"></span></div>
  </div>

  <div class="card">
    <h2>3. Payment</h2>
    <div class="pay">
      <label class="opt"><input type="radio" name="pm" value="E-wallet" checked> E-wallet (InstaPay QR)</label>
      <label class="opt"><input type="radio" name="pm" value="Bank transfer"> Bank transfer (GoTyme QR)</label>
    </div>
    <div id="instr" class="instr"></div>
    <div id="refbox">
      <label for="ref">Payment reference number</label>
      <input id="ref" placeholder="e.g. transaction ID from your receipt">
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <div class="line"><span id="sumline"></span><span id="sub"></span></div>
    <div class="total"><span>Total</span><span id="total"></span></div>
    <div class="err" id="err" role="alert"></div>
    <button type="submit">Register &amp; get QR ticket</button>
  </div>
</form>

<div id="done" class="card ticket hide">
  <span class="badge" id="status"></span>
  <h2 style="margin-top:12px">You’re registered!</h2>
  <div class="qr" id="qr"></div>
  <div style="font-weight:700;letter-spacing:.05em" id="rid"></div>
  <div class="kv" id="kv"></div>
  <p style="color:var(--muted);font-size:.85rem">Show this QR code at the entrance for check-in.</p>
  <button class="ghost noprint" onclick="window.print()">Print / save as PDF</button>
  <button class="ghost noprint" id="again">Register another person</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

var CFG = {
  currency: "Php ",
  fee: 350,
  ewalletName: "YourWallet",
  ewalletNumber: "0900 000 0000",
  ewalletAccount: "Event Organizer",
  bankName: "Your Bank",
  bankNumber: "0000-0000-00",
  bankAccount: "Event Organizer"
};
var $ = function(id){return document.getElementById(id)};
var money = function(n){return CFG.currency + n.toLocaleString()};

function pm(){return document.querySelector('input[name="pm"]:checked').value}
function rt(){return document.querySelector('input[name="rt"]:checked').value}
function count(){if(rt()!=="Group")return 1;var n=parseInt($("gsize").value,10);return isNaN(n)?0:n}
function total(){return CFG.fee*count()}

function render(){
  var m = pm();
  var g = rt() === "Group";
  $("gbox").classList.toggle("hide", !g);
  $("nlabel").textContent = g ? "Contact person’s full name" : "Full name";
  $("fee").textContent = money(CFG.fee);
  $("sumline").textContent = g ? count() + " people × " + money(CFG.fee) : "1 person × " + money(CFG.fee);
  $("sub").textContent = money(total());
  $("total").textContent = money(total());
  var img = m === "E-wallet" ? QR_EWALLET : QR_BANK;
  $("instr").innerHTML = "Scan the QR code below with your banking or e-wallet app (InstaPay) and send exactly <b>" + money(total()) + "</b>. Then enter the reference number from your receipt.<div style='text-align:center'><img class='payqr' alt='" + m + " payment QR code' src='" + img + "'></div>";
}
document.querySelectorAll('input[name="pm"], input[name="rt"]').forEach(function(r){r.addEventListener("change", render)});
$("gsize").addEventListener("input", render);

function esc(s){return s.replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

$("f").addEventListener("submit", function(e){
  e.preventDefault();
  var name = $("name").value.trim(), email = $("email").value.trim(), phone = $("phone").value.trim(), ref = $("ref").value.trim();
  var m = pm(), err = $("err");
  if (!name) return err.textContent = "Please enter your full name.";
  if (rt() === "Group" && (count() < 2 || count() > 100)) return err.textContent = "Please enter a group size between 2 and 100.";
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err.textContent = "Please enter a valid email.";
  if (phone.replace(/\D/g, "").length < 7) return err.textContent = "Please enter a valid phone number.";
  if (ref.length < 4) return err.textContent = "Please enter your payment reference number.";
  err.textContent = "";

  var id = "REG-" + Date.now().toString(36).toUpperCase().slice(-6) + Math.random().toString(36).toUpperCase().slice(2, 4);
  var status = "PAYMENT SUBMITTED";
  var payload = ["ID:" + id, "NAME:" + name, "TYPE:" + (rt() === "Group" ? "GROUP x" + count() : "INDIVIDUAL"), "TOTAL:" + total(), "PAY:" + m + " #" + ref, "STATUS:" + status].join("\n");

  try {
    var qr = qrcode(0, "M"); qr.addData(payload); qr.make();
    $("qr").innerHTML = qr.createSvgTag(5, 0);
  } catch (x) { $("qr").textContent = "Could not generate QR. Your ID: " + id; }

  try {
    var list = JSON.parse(localStorage.getItem("regs") || "[]");
    list.push({id: id, name: name, email: email, phone: phone, type: rt(), people: count(), total: total(), method: m, ref: ref, status: status});
    localStorage.setItem("regs", JSON.stringify(list));
  } catch (x) {}

  $("status").textContent = status;
  $("rid").textContent = id;
  $("kv").innerHTML = "<div class='line'><span>Name</span><span>" + esc(name) + "</span></div>" +
    "<div class='line'><span>Registration</span><span>" + (rt() === "Group" ? "Group of " + count() : "Individual") + "</span></div>" +
    "<div class='line'><span>Payment</span><span>" + esc(m) + "</span></div>" +
    "<div class='line'><span>Amount</span><span>" + money(total()) + "</span></div>";
  $("f").classList.add("hide");
  $("done").classList.remove("hide");
  window.scrollTo(0, 0);
});

$("again").addEventListener("click", function(){
  $("f").reset(); render();
  $("done").classList.add("hide");
  $("f").classList.remove("hide");
});
render();
</script>
</body>
</html>
